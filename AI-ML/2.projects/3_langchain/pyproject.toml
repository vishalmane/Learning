[project]
name = "langchain-lab"
version = "0.1.0"
description = "A UV-based Python playground for trying LangChain capabilities."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4",
    "chromadb",
    "faiss-cpu",
    "langchain",
    "langchain-chroma",
    "langchain-community",
    "langchain-core",
    "langchain-google-genai",
    "langchain-text-splitters",
    "langgraph",
    "langsmith",
    "pydantic",
    "python-dotenv",
    "streamlit",
    "tiktoken",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/lc_lab"]

[tool.hatch.build.targets.sdist]
include = [
    "src/lc_lab",
    "examples",
    "ui",
    "data",
    "tests",
    "README.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
