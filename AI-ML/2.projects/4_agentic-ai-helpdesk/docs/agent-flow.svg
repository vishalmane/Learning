<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Agentic AI Helpdesk Flow</title>
  <desc id="desc">Flow diagram showing the user request moving through planner, governance, retrieval, tool execution, reasoning, memory, response, and human review branch.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#245f73"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#15313a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#f4f7f6"/>
  <text x="64" y="62" fill="#17211f" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Agentic AI Helpdesk Assistant</text>
  <text x="64" y="92" fill="#60706b" font-family="Segoe UI, Arial, sans-serif" font-size="16">LangGraph orchestration: plan, govern, retrieve, act, reason, remember, respond</text>

  <g font-family="Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <rect x="64" y="142" width="160" height="82" rx="8" fill="#ffffff" stroke="#d9e2df"/>
    <text x="144" y="174" text-anchor="middle" fill="#17211f" font-size="18" font-weight="700">User Request</text>
    <text x="144" y="200" text-anchor="middle" fill="#60706b" font-size="13">user_id + query</text>

    <rect x="284" y="142" width="160" height="82" rx="8" fill="#ffffff" stroke="#d9e2df"/>
    <text x="364" y="174" text-anchor="middle" fill="#17211f" font-size="18" font-weight="700">Planner</text>
    <text x="364" y="200" text-anchor="middle" fill="#60706b" font-size="13">creates steps</text>

    <rect x="504" y="142" width="170" height="82" rx="8" fill="#ffffff" stroke="#d9e2df"/>
    <text x="589" y="174" text-anchor="middle" fill="#17211f" font-size="18" font-weight="700">Governance</text>
    <text x="589" y="200" text-anchor="middle" fill="#60706b" font-size="13">policy checks</text>

    <rect x="744" y="142" width="170" height="82" rx="8" fill="#ffffff" stroke="#d9e2df"/>
    <text x="829" y="174" text-anchor="middle" fill="#17211f" font-size="18" font-weight="700">Retriever</text>
    <text x="829" y="200" text-anchor="middle" fill="#60706b" font-size="13">knowledge docs</text>

    <rect x="984" y="142" width="190" height="82" rx="8" fill="#ffffff" stroke="#d9e2df"/>
    <text x="1079" y="174" text-anchor="middle" fill="#17211f" font-size="18" font-weight="700">Tool Executor</text>
    <text x="1079" y="200" text-anchor="middle" fill="#60706b" font-size="13">VPN, ticket, notify</text>

    <rect x="744" y="342" width="170" height="82" rx="8" fill="#ffffff" stroke="#d9e2df"/>
    <text x="829" y="374" text-anchor="middle" fill="#17211f" font-size="18" font-weight="700">Reasoning</text>
    <text x="829" y="400" text-anchor="middle" fill="#60706b" font-size="13">root cause + action</text>

    <rect x="504" y="342" width="170" height="82" rx="8" fill="#ffffff" stroke="#d9e2df"/>
    <text x="589" y="374" text-anchor="middle" fill="#17211f" font-size="18" font-weight="700">Memory</text>
    <text x="589" y="400" text-anchor="middle" fill="#60706b" font-size="13">save interaction</text>

    <rect x="284" y="342" width="160" height="82" rx="8" fill="#ffffff" stroke="#d9e2df"/>
    <text x="364" y="374" text-anchor="middle" fill="#17211f" font-size="18" font-weight="700">Response</text>
    <text x="364" y="400" text-anchor="middle" fill="#60706b" font-size="13">final answer</text>

    <rect x="504" y="522" width="170" height="82" rx="8" fill="#fff4d8" stroke="#e6c878"/>
    <text x="589" y="554" text-anchor="middle" fill="#17211f" font-size="18" font-weight="700">Human Review</text>
    <text x="589" y="580" text-anchor="middle" fill="#9a5b00" font-size="13">approval required</text>
  </g>

  <g stroke="#245f73" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M224 183 H284"/>
    <path d="M444 183 H504"/>
    <path d="M674 183 H744"/>
    <path d="M914 183 H984"/>
    <path d="M1079 224 V292 H829 V342"/>
    <path d="M744 383 H674"/>
    <path d="M504 383 H444"/>
    <path d="M589 224 V522"/>
    <path d="M504 563 H364 V424"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="681" y="160" width="54" height="24" rx="12" fill="#def6e9"/>
    <text x="708" y="177" text-anchor="middle" fill="#17613d" font-size="12" font-weight="700">allow</text>
    <rect x="602" y="256" width="86" height="24" rx="12" fill="#fff4d8"/>
    <text x="645" y="273" text-anchor="middle" fill="#9a5b00" font-size="12" font-weight="700">sensitive</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="64" y="620" width="1110" height="54" rx="8" fill="#ffffff" stroke="#d9e2df"/>
    <text x="84" y="643" fill="#17211f" font-size="14" font-weight="700">Sample:</text>
    <text x="150" y="643" fill="#60706b" font-size="14">"My VPN stopped working" creates a plan, retrieves VPN MFA docs, runs VPN diagnostics, reasons over MFA timeout, saves memory, and returns a recommended action.</text>
    <text x="84" y="664" fill="#17211f" font-size="14" font-weight="700">Sensitive branch:</text>
    <text x="195" y="664" fill="#60706b" font-size="14">"Please remove access" routes to Human Review and returns an approval-required response.</text>
  </g>
</svg>
